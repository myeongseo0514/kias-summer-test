<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원운동 시뮬레이션</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #101318;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #f8fafc;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 14px;
      text-align: center;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .nav a {
      color: #cbd5e1;
      background: #1b202b;
      border: 1px solid #30384b;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      text-decoration: none;
    }

    .nav a[aria-current="page"] {
      color: #04130d;
      background: #34d399;
      border-color: #34d399;
    }

    .container {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 980px;
      width: 100%;
    }

    .canvas-wrap {
      background: #1b202b;
      border: 1px solid #30384b;
      border-radius: 12px;
      padding: 8px;
      flex-shrink: 0;
      max-width: 100%;
    }

    canvas {
      display: block;
      border-radius: 8px;
      max-width: 100%;
      height: auto;
    }

    .controls {
      background: #1b202b;
      border: 1px solid #30384b;
      border-radius: 12px;
      padding: 20px;
      min-width: 280px;
      flex: 1;
    }

    .controls h2 {
      font-size: 0.9rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    .field { margin-bottom: 14px; }

    .field label {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 0.875rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    .field label span {
      color: #34d399;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #34d399;
      cursor: pointer;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    .toggle input {
      width: 16px;
      height: 16px;
      accent-color: #34d399;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary {
      background: #34d399;
      color: #04130d;
    }

    .btn-primary:hover { background: #10b981; }

    .btn-secondary {
      background: #30384b;
      color: #e2e8f0;
    }

    .btn-secondary:hover { background: #424d66; }

    .readout {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 16px;
      font-size: 0.78rem;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
    }

    .readout div {
      background: #101318;
      border-radius: 8px;
      padding: 10px;
      min-height: 52px;
    }

    .readout strong {
      display: block;
      color: #34d399;
      font-size: 0.95rem;
      margin-top: 3px;
    }

    .info {
      margin-top: 16px;
      padding: 12px;
      background: #101318;
      border-radius: 8px;
      font-size: 0.78rem;
      color: #64748b;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      body { padding: 18px 10px; }
      .controls { min-width: 0; }
      .readout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>원운동 시뮬레이션</h1>
  <p class="subtitle">등속 원운동 · 구심가속도 · 속도와 가속도 벡터</p>

  <nav class="nav" aria-label="시뮬레이션 이동">
    <a href="index.html">이중진자</a>
    <a href="circular-motion.html" aria-current="page">원운동</a>
    <a href="projectile-motion.html">포물선 운동</a>
  </nav>

  <div class="container">
    <div class="canvas-wrap">
      <canvas id="canvas" width="560" height="520"></canvas>
    </div>

    <div class="controls">
      <h2>파라미터</h2>

      <div class="field">
        <label>반지름 R (m) <span id="radiusVal">1.50</span></label>
        <input type="range" id="radius" min="0.4" max="2.4" step="0.05" value="1.5">
      </div>

      <div class="field">
        <label>각속도 ω (rad/s) <span id="omegaVal">1.60</span></label>
        <input type="range" id="omega" min="-4" max="4" step="0.05" value="1.6">
      </div>

      <div class="field">
        <label>질량 m (kg) <span id="massVal">1.00</span></label>
        <input type="range" id="mass" min="0.2" max="5" step="0.1" value="1">
      </div>

      <div class="field">
        <label>초기 위상 θ₀ (°) <span id="phaseVal">35</span></label>
        <input type="range" id="phase" min="0" max="360" step="1" value="35">
      </div>

      <label class="toggle">
        <input type="checkbox" id="trailToggle" checked>
        궤적 표시
      </label>

      <div class="btn-row">
        <button class="btn-primary" id="resetBtn">초기화</button>
        <button class="btn-secondary" id="pauseBtn">일시정지</button>
      </div>

      <div class="readout">
        <div>시간 t<strong id="timeVal">0.00 s</strong></div>
        <div>속력 v = Rω<strong id="speedVal">0.00 m/s</strong></div>
        <div>구심가속도 a = Rω²<strong id="accelVal">0.00 m/s²</strong></div>
        <div>구심력 F = ma<strong id="forceVal">0.00 N</strong></div>
      </div>

      <div class="info">
        물체는 x = R cos(θ), y = R sin(θ)를 따라 움직입니다.
        초록색 화살표는 속도, 주황색 화살표는 중심을 향하는 구심가속도입니다.
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const CENTER_X = canvas.width / 2;
    const CENTER_Y = canvas.height / 2;
    const SCALE = 145;
    const TRAIL_LIMIT = 520;

    const sliders = {
      radius: document.getElementById('radius'),
      omega: document.getElementById('omega'),
      mass: document.getElementById('mass'),
      phase: document.getElementById('phase'),
    };

    const values = {
      radius: document.getElementById('radiusVal'),
      omega: document.getElementById('omegaVal'),
      mass: document.getElementById('massVal'),
      phase: document.getElementById('phaseVal'),
      time: document.getElementById('timeVal'),
      speed: document.getElementById('speedVal'),
      accel: document.getElementById('accelVal'),
      force: document.getElementById('forceVal'),
    };

    let radius = 1.5;
    let omega = 1.6;
    let mass = 1;
    let phase = 35 * Math.PI / 180;
    let time = 0;
    let lastTimestamp = null;
    let running = true;
    let trail = [];

    function updateParams() {
      radius = parseFloat(sliders.radius.value);
      omega = parseFloat(sliders.omega.value);
      mass = parseFloat(sliders.mass.value);
      phase = parseFloat(sliders.phase.value) * Math.PI / 180;

      values.radius.textContent = radius.toFixed(2);
      values.omega.textContent = omega.toFixed(2);
      values.mass.textContent = mass.toFixed(2);
      values.phase.textContent = sliders.phase.value;
    }

    function positionAt(t) {
      const theta = phase + omega * t;
      return {
        theta,
        x: CENTER_X + radius * SCALE * Math.cos(theta),
        y: CENTER_Y - radius * SCALE * Math.sin(theta),
      };
    }

    function drawGrid() {
      ctx.strokeStyle = '#242b38';
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function drawArrow(fromX, fromY, toX, toY, color) {
      const angle = Math.atan2(toY - fromY, toX - fromX);
      const head = 10;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - head * Math.cos(angle - Math.PI / 6), toY - head * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - head * Math.cos(angle + Math.PI / 6), toY - head * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    }

    function drawLabels(point, speed, accel) {
      ctx.font = '13px Segoe UI, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('O', CENTER_X + 10, CENTER_Y - 10);
      if (speed > 0.001) {
        ctx.fillStyle = '#34d399';
        ctx.fillText('v', point.x + 48, point.y - 20);
      }
      if (accel > 0.001) {
        ctx.fillStyle = '#f59e0b';
        ctx.fillText('a', (point.x + CENTER_X) / 2 + 8, (point.y + CENTER_Y) / 2 - 8);
      }
      values.time.textContent = `${time.toFixed(2)} s`;
      values.speed.textContent = `${speed.toFixed(2)} m/s`;
      values.accel.textContent = `${accel.toFixed(2)} m/s²`;
      values.force.textContent = `${(mass * accel).toFixed(2)} N`;
    }

    function draw() {
      ctx.fillStyle = '#101318';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid();

      const point = positionAt(time);
      const speed = Math.abs(radius * omega);
      const accel = radius * omega * omega;
      const trackRadius = radius * SCALE;

      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(CENTER_X, CENTER_Y, trackRadius, 0, Math.PI * 2);
      ctx.stroke();

      if (document.getElementById('trailToggle').checked && trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(trail[0].x, trail[0].y);
        for (let i = 1; i < trail.length; i++) {
          ctx.lineTo(trail[i].x, trail[i].y);
        }
        ctx.strokeStyle = 'rgba(52, 211, 153, 0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(CENTER_X, CENTER_Y);
      ctx.lineTo(point.x, point.y);
      ctx.stroke();

      ctx.fillStyle = '#94a3b8';
      ctx.beginPath();
      ctx.arc(CENTER_X, CENTER_Y, 6, 0, Math.PI * 2);
      ctx.fill();

      if (speed > 0.001) {
        const tangentSign = omega >= 0 ? -1 : 1;
        const tangentX = tangentSign * Math.sin(point.theta);
        const tangentY = tangentSign * Math.cos(point.theta);
        const velocityScale = Math.min(100, 24 + speed * 18);
        drawArrow(point.x, point.y, point.x + tangentX * velocityScale, point.y + tangentY * velocityScale, '#34d399');
      }

      if (accel > 0.001) {
        const inwardX = CENTER_X - point.x;
        const inwardY = CENTER_Y - point.y;
        const inwardLength = Math.hypot(inwardX, inwardY);
        const accelScale = Math.min(inwardLength * 0.55, 18 + accel * 10);
        drawArrow(
          point.x,
          point.y,
          point.x + (inwardX / inwardLength) * accelScale,
          point.y + (inwardY / inwardLength) * accelScale,
          '#f59e0b'
        );
      }

      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(point.x, point.y, 13 + mass * 1.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 2;
      ctx.stroke();

      drawLabels(point, speed, accel);
    }

    function reset() {
      time = 0;
      lastTimestamp = null;
      trail = [];
      draw();
    }

    function tick(timestamp) {
      if (lastTimestamp === null) lastTimestamp = timestamp;
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
      lastTimestamp = timestamp;

      if (running) {
        time += dt;
        const point = positionAt(time);
        trail.push({ x: point.x, y: point.y });
        if (trail.length > TRAIL_LIMIT) trail.shift();
      }

      draw();
      requestAnimationFrame(tick);
    }

    Object.values(sliders).forEach((slider) => {
      slider.addEventListener('input', () => {
        updateParams();
        trail = [];
      });
    });

    document.getElementById('trailToggle').addEventListener('change', () => {
      trail = [];
    });

    document.getElementById('resetBtn').addEventListener('click', reset);
    document.getElementById('pauseBtn').addEventListener('click', () => {
      running = !running;
      document.getElementById('pauseBtn').textContent = running ? '일시정지' : '재생';
      lastTimestamp = null;
    });

    updateParams();
    reset();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
